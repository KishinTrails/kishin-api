version: 2
updates:
  # Python packages in pyproject.toml and poetry.lock. Dependabot reads Poetry projects through
  # the pip ecosystem. Minor and patch updates arrive as one pull request; a major update is
  # its own pull request.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  # The python:3.14-slim base image in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  # The actions used in .github/workflows, referenced by version tag.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
