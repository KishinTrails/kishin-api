<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Withings authorisation code</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; text-align: center; }
    input { width: 100%; box-sizing: border-box; padding: 0.5rem; font-family: monospace; font-size: 1rem; }
    button { margin-top: 0.75rem; padding: 0.5rem 1.5rem; font-size: 1rem; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Withings authorisation code</h1>
  <p id="message">Reading the code from this page's address…</p>
  <input id="code" type="text" readonly hidden>
  <button id="copy" type="button" hidden>Copy</button>
  <p id="note" hidden>Paste it into the waiting program within 30 seconds. After that, Withings rejects it.</p>
  <script src="withings.js"></script>
</body>
</html>
